[project]
name = "supercell-wx-mcp"
version = "0.1.0"
description = "MCP server for Supercell Wx: NEXRAD radar data, NWS alerts, and project release info"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "NicksSoftwareFun" }]
keywords = ["mcp", "nexrad", "weather", "radar", "supercell-wx", "nws"]
dependencies = [
    "mcp>=1.2.0",
    "httpx>=0.27",
]

[project.scripts]
supercell-wx-mcp = "supercell_wx_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/supercell_wx_mcp"]
