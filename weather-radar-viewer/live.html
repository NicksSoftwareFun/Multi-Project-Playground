<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SKYWATCH Live — Real Radar + GOES-East</title>
<!--
  Live companion to mockup.html. Open this file directly in a browser
  (double-click, or serve locally) — it pulls REAL data:
    - Past radar:   IEM NEXRAD N0Q composite tiles (5-min steps, last 50 min)
    - Forecast:     IEM HRRR simulated reflectivity (REFD) tiles, 15-min steps
    - Satellite:    GOES-East (GOES-19) CONUS GeoColor from NOAA STAR,
                    shown as its own full-screen view (SAT button) — the GOES
                    image is in geostationary projection, so it is NOT drawn
                    on the flat radar map.
  Notes:
    - HRRR runs hourly and takes ~1-2 h to appear on IEM; if forecast tiles
      404, the app automatically falls back to an older run.
    - Free-tier friendly: personal use, modest request rates.
-->
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
  html, body { margin: 0; height: 100%; background: #0A1018; color: #D7E2EC;
               font-family: system-ui, "Segoe UI", Roboto, sans-serif; }
  #map { position: absolute; inset: 0; }
  .panel {
    position: absolute; z-index: 1000;
    background: rgba(8,14,22,0.88);
    border: 1px solid rgba(140,170,195,0.3);
    border-radius: 8px;
  }
  .topbar {
    top: 10px; left: 50%; transform: translateX(-50%);
    display: flex; align-items: center; gap: 12px;
    padding: 8px 14px;
    white-space: nowrap;
  }
  .brand { font-weight: 700; letter-spacing: 0.08em; font-size: 14px; }
  .badge {
    font-family: ui-monospace, Consolas, monospace;
    font-size: 11px; letter-spacing: 0.05em;
    padding: 3px 8px; border-radius: 4px; border: 1px solid;
  }
  .badge.mrms { color: #6ADBD0; border-color: #2E6E68; background: rgba(23,61,58,0.55); }
  .badge.fcst { color: #C9A6F5; border-color: #6C4E9E; background: rgba(48,32,76,0.55); }
  .badge.sat  { color: #8FC7F5; border-color: #3A6C9E; background: rgba(22,44,70,0.55); }
  .vtime { font-family: ui-monospace, Consolas, monospace; font-size: 12px; color: #BFD3E2; }
  .botbar {
    bottom: 14px; left: 50%; transform: translateX(-50%);
    display: flex; align-items: center; gap: 12px;
    padding: 10px 16px;
    width: min(640px, calc(100vw - 40px));
  }
  button {
    height: 38px; min-width: 38px; border-radius: 8px;
    border: 1px solid rgba(140,170,195,0.35);
    background: rgba(16,26,38,0.9); color: #CFE0EE;
    font-size: 16px; cursor: pointer;
    font-family: inherit;
  }
  button:hover { background: rgba(30,46,64,0.9); }
  button.txt {
    font-family: ui-monospace, Consolas, monospace;
    font-size: 11px; letter-spacing: 0.08em; font-weight: 700;
    padding: 0 12px;
  }
  button.on { border-color: #53C7F0; color: #53C7F0; }
  .trackbox { flex: 1; position: relative; display: flex; align-items: center; }
  input[type=range] {
    width: 100%; -webkit-appearance: none; appearance: none; margin: 0;
    height: 4px; border-radius: 2px;
    background: linear-gradient(to right,
      rgba(120,170,200,0.5) 0 47.6%, rgba(160,120,220,0.45) 47.6% 100%);
    cursor: pointer;
  }
  input[type=range]::-webkit-slider-thumb {
    -webkit-appearance: none; width: 16px; height: 16px; border-radius: 50%;
    background: #53C7F0; border: 2px solid #0A1018;
  }
  input[type=range]::-moz-range-thumb {
    width: 14px; height: 14px; border-radius: 50%;
    background: #53C7F0; border: 2px solid #0A1018;
  }
  .nowmark {
    position: absolute; left: 47.6%; top: -14px; transform: translateX(-50%);
    font-family: ui-monospace, Consolas, monospace; font-size: 9px;
    letter-spacing: 0.1em; color: #9FB4C6; pointer-events: none;
  }
  .lbl { font-family: ui-monospace, Consolas, monospace; font-size: 10px; color: #7E93A5; }
  .lbl.f { color: #A88BD8; }
  .status {
    top: 10px; left: 10px;
    padding: 8px 12px;
    font-family: ui-monospace, Consolas, monospace;
    font-size: 10.5px; line-height: 1.6; color: #8FA5B7;
  }
  .status .on { color: #6ADBD0; }
  .status .off { color: #E07A5F; }
  .leaflet-container { background: #0A1018; }

  /* ---- full-screen satellite view (raw GOES image, no georeferencing) ---- */
  #satview {
    position: absolute; inset: 0; z-index: 900;
    background: #000; overflow: hidden;
    display: none;
  }
  body.sat #satview { display: block; }
  body.sat .botbar { display: none; }
  body.sat #map { visibility: hidden; }
  #satview img {
    position: absolute; top: 50%; right: 0;
    transform: translateY(-50%);
    height: 100%;
  }
  #satview.full img {
    height: auto; width: 100%;
    top: 50%; right: auto; left: 0;
  }
  .satcontrols {
    bottom: 14px; right: 14px;
    display: flex; gap: 8px; padding: 8px;
    z-index: 1001;
  }
  .satmsg {
    position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
    font-family: ui-monospace, Consolas, monospace; font-size: 12px;
    color: #8FA5B7; display: none;
  }
  #satview.err .satmsg { display: block; }
  #satview.err img { display: none; }
</style>
</head>
<body>
<div id="map"></div>

<div id="satview">
  <img id="satimg" alt="GOES-East GeoColor satellite image">
  <div class="satmsg">GOES-EAST IMAGE UNAVAILABLE — CHECK CONNECTION</div>
  <div class="panel satcontrols">
    <button class="txt on" id="cropBtn">EAST</button>
  </div>
</div>

<div class="panel topbar">
  <span class="brand">SKYWATCH LIVE</span>
  <span class="badge mrms" id="srcBadge">NEXRAD N0Q · IEM</span>
  <span class="vtime" id="vtime">--:--</span>
  <button class="txt" id="viewBtn">SAT</button>
</div>
<div class="panel status" id="status">loading…</div>
<div class="panel botbar">
  <button id="playBtn" aria-label="Play or pause">⏸</button>
  <span class="lbl">-50m</span>
  <div class="trackbox">
    <div class="nowmark">NOW</div>
    <input type="range" id="scrub" min="0" max="21" value="10" step="1" aria-label="Radar timeline">
  </div>
  <span class="lbl f">+2:45</span>
</div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
(function () {
  "use strict";
  const IEM = "https://mesonet.agron.iastate.edu/cache/tile.py/1.0.0/";
  const GOES_DIR = "https://cdn.star.nesdis.noaa.gov/GOES19/ABI/CONUS/GEOCOLOR/";
  const GOES_PRIMARY = GOES_DIR + "GOES19-ABI-CONUS-GEOCOLOR-2500x1500.jpg";
  const GOES_FALLBACK = GOES_DIR + "latest.jpg";

  const PAST = 11;   // t = -50 .. 0 min, 5-min steps
  const FUT = 11;    // t = +15 .. +165 min, 15-min steps
  const NOW_I = PAST - 1;
  const NFRAMES = PAST + FUT;
  function frameT(i) { return i < PAST ? -(PAST - 1 - i) * 5 : (i - PAST + 1) * 15; }

  // Leaflet comes from a CDN; if it failed to load (offline, blocked), keep the
  // rest of the app — including the SAT view — alive and say so in the status.
  let map = null;
  if (window.L) {
    map = L.map("map", {
      center: [38.5, -86],
      zoom: 5,
      minZoom: 3,
      maxZoom: 10,
      zoomControl: true,
      attributionControl: true
    });
    // Esri "Dark Gray Canvas" — keyless. Replaced CARTO, which began requiring
    // an API key and served "API KEY REQUIRED" watermark tiles for keyless use.
    const esri = "https://server.arcgisonline.com/ArcGIS/rest/services/Canvas";
    L.tileLayer(esri + "/World_Dark_Gray_Base/MapServer/tile/{z}/{y}/{x}", {
      attribution: "&copy; Esri · OSM · Radar: IEM/NOAA · Sat: NOAA STAR",
      maxNativeZoom: 16
    }).addTo(map);
    L.tileLayer(esri + "/World_Dark_Gray_Reference/MapServer/tile/{z}/{y}/{x}", {
      maxNativeZoom: 16
    }).addTo(map);
  }

  // ---- full-screen GOES-East view (raw image, refreshed every 5 min) ----
  const satview = document.getElementById("satview");
  const satimg = document.getElementById("satimg");
  let goesOk = false;
  let goesFetched = null;
  let triedFallback = false;
  satimg.addEventListener("load", function () {
    goesOk = true;
    goesFetched = new Date();
    satview.classList.remove("err");
    updateStatus();
    if (satMode) updateChrome();
  });
  satimg.addEventListener("error", function () {
    if (!triedFallback) {
      triedFallback = true;
      satimg.src = GOES_FALLBACK + "?t=" + Date.now();
      return;
    }
    goesOk = false;
    satview.classList.add("err");
    updateStatus();
  });
  function loadGoes() {
    triedFallback = false;
    satimg.src = GOES_PRIMARY + "?t=" + Date.now();
  }
  loadGoes();
  setInterval(loadGoes, 5 * 60 * 1000);

  // ---- radar frame layers ----
  function pad(n, w) { return String(n).padStart(w, "0"); }
  function utcStamp(d, minStep) {
    const m = Math.floor(d.getUTCMinutes() / minStep) * minStep;
    return "" + d.getUTCFullYear() + pad(d.getUTCMonth() + 1, 2) + pad(d.getUTCDate(), 2) +
           pad(d.getUTCHours(), 2) + pad(m, 2);
  }

  let hrrrRunOffsetHrs = 2;     // try the run from ~2 h ago first; fall back older on 404s
  let hrrrErrors = 0;
  let radarErrors = 0;

  function hrrrInit() {
    const d = new Date(Date.now() - hrrrRunOffsetHrs * 3600 * 1000);
    d.setUTCMinutes(0, 0, 0);
    return d;
  }
  function layerUrl(i) {
    const t = frameT(i);
    if (i < PAST) {
      // Explicit timestamps for every frame, including "now" (with a ~3 min
      // processing lag). The "-0" current alias is cached per tile on IEM's
      // side, which can mix scan times and cut storms off at tile seams.
      const d = new Date(Date.now() - 180000 + t * 60000);
      return IEM + "ridge::USCOMP-N0Q-" + utcStamp(d, 5) + "/{z}/{x}/{y}.png";
    }
    const init = hrrrInit();
    const validMs = Date.now() + t * 60000;
    let fmin = Math.round((validMs - init.getTime()) / 900000) * 15;
    fmin = Math.max(0, Math.min(1080, fmin));
    return IEM + "hrrr::REFD-F" + pad(fmin, 4) + "-" + utcStamp(init, 60) + "/{z}/{x}/{y}.png";
  }

  const layers = new Array(NFRAMES).fill(null);
  function buildLayer(i) {
    if (!map) return null;
    // updateWhenIdle/keepBuffer keep the request count down — IEM renders
    // tiles on demand, and hammering it during pans is what loses tiles.
    const lyr = L.tileLayer(layerUrl(i), {
      opacity: 0, zIndex: 400, maxNativeZoom: 9,
      updateWhenIdle: true, updateWhenZooming: false, keepBuffer: 0
    });
    lyr.on("tileerror", function () {
      if (i < PAST) { radarErrors++; }
      else {
        hrrrErrors++;
        if (hrrrErrors > 12 && hrrrRunOffsetHrs < 6) {
          hrrrErrors = 0;
          hrrrRunOffsetHrs++;      // this HRRR run isn't on IEM yet — use an older one
          rebuildFuture();
        }
      }
      updateStatus();
    });
    lyr.addTo(map);
    return lyr;
  }
  function rebuildFuture() {
    for (let i = PAST; i < NFRAMES; i++) {
      if (layers[i]) { map.removeLayer(layers[i]); layers[i] = null; }
    }
    if (frame >= PAST) show(frame);
  }

  let frame = NOW_I;
  function show(i) {
    frame = i;
    const nx = (i + 1) % NFRAMES;         // preload the next frame in the loop
    if (!layers[i]) layers[i] = buildLayer(i);
    if (!layers[nx]) layers[nx] = buildLayer(nx);
    // Only the visible frame and the preloading one stay on the map; keeping
    // all frames attached multiplies tile requests on every pan/zoom, and
    // failed requests show up as blank rectangles cut along tile edges.
    for (let j = 0; j < NFRAMES; j++) {
      const lyr = layers[j];
      if (!lyr || !map) continue;
      if (j === i || j === nx) {
        if (!map.hasLayer(lyr)) lyr.addTo(map);
        lyr.setOpacity(j === i ? 0.75 : 0);
      } else if (map.hasLayer(lyr)) {
        map.removeLayer(lyr);
      }
    }
    updateChrome();
  }

  // ---- chrome ----
  const scrub = document.getElementById("scrub");
  const playBtn = document.getElementById("playBtn");
  const srcBadge = document.getElementById("srcBadge");
  const vtime = document.getElementById("vtime");
  const statusEl = document.getElementById("status");
  const viewBtn = document.getElementById("viewBtn");
  const cropBtn = document.getElementById("cropBtn");
  let satMode = false;
  function fmt(d) { return pad(d.getHours(), 2) + ":" + pad(d.getMinutes(), 2); }
  function updateChrome() {
    if (satMode) {
      srcBadge.textContent = "GOES-EAST GEOCOLOR · CONUS";
      srcBadge.className = "badge sat";
      vtime.textContent = goesFetched ? "FETCHED " + fmt(goesFetched) : "--:--";
      return;
    }
    scrub.value = String(frame);
    const t = frameT(frame);
    const d = new Date(Date.now() + t * 60000);
    if (frame < PAST) {
      srcBadge.textContent = "NEXRAD N0Q · IEM COMPOSITE";
      srcBadge.className = "badge mrms";
      vtime.textContent = fmt(d) + (frame === NOW_I ? " · LATEST" : "");
    } else {
      srcBadge.textContent = "HRRR REFD FCST · +" + Math.floor(t / 60) + ":" + pad(t % 60, 2);
      srcBadge.className = "badge fcst";
      vtime.textContent = "FCST " + fmt(d);
    }
  }
  function updateStatus() {
    statusEl.innerHTML =
      "RADAR  <span class='" + (map ? (radarErrors < 20 ? "on'>ok" : "off'>errors") : "off'>map lib unavailable") + "</span><br>" +
      "HRRR   <span class='on'>run -" + hrrrRunOffsetHrs + "h</span><br>" +
      "GOES-E <span class='" + (goesOk ? "on'>ok" : "off'>unavailable") + "</span>";
  }
  updateStatus();

  viewBtn.addEventListener("click", function () {
    satMode = !satMode;
    document.body.classList.toggle("sat", satMode);
    viewBtn.textContent = satMode ? "RADAR" : "SAT";
    viewBtn.classList.toggle("on", satMode);
    // refresh the image if it's stale when entering sat view
    if (satMode && (!goesFetched || Date.now() - goesFetched.getTime() > 5 * 60 * 1000)) {
      loadGoes();
    }
    updateChrome();
  });
  cropBtn.addEventListener("click", function () {
    const full = satview.classList.toggle("full");
    cropBtn.textContent = full ? "FULL" : "EAST";
    cropBtn.classList.toggle("on", !full);
  });

  let playing = true;
  playBtn.addEventListener("click", function () {
    playing = !playing;
    playBtn.textContent = playing ? "⏸" : "▶";
  });
  scrub.addEventListener("input", function () {
    playing = false;
    playBtn.textContent = "▶";
    show(parseInt(scrub.value, 10));
  });
  setInterval(function () {
    if (playing && !satMode) show((frame + 1) % NFRAMES);
  }, 700);

  // Radar timestamps are computed when a layer is built; rebuild the past
  // frames every 5 minutes so a long-running display keeps up with new scans.
  setInterval(function () {
    for (let i = 0; i < PAST; i++) {
      if (layers[i]) {
        if (map && map.hasLayer(layers[i])) map.removeLayer(layers[i]);
        layers[i] = null;
      }
    }
    show(frame);
  }, 5 * 60 * 1000);

  show(NOW_I);
})();
</script>
</body>
</html>
