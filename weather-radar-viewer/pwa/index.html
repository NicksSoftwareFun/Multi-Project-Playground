<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>SKYWATCH Radar</title>
<!--
  SKYWATCH — free, keyless, data-display weather console.
  Static no-build PWA: plain ES modules + CSS served as-is; the Android APK
  is a WebView on this hosted origin, so web deploys reach it instantly.
  Live feeds: IEM NEXRAD N0Q tiles (past) + IEM HRRR REFD tiles (forecast),
  NOAA STAR GOES-East GeoColor, Open-Meteo with NWS fallback (conditions).
-->
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#0A1018">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="SKYWATCH">

<link rel="stylesheet" href="vendor/leaflet/leaflet.css">
<link rel="stylesheet" href="css/tokens.css">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/chrome.css">
<link rel="stylesheet" href="css/views.css">
<link rel="stylesheet" href="css/boards.css">
<link rel="stylesheet" href="css/charts.css">
</head>
<body>
<div class="device">
  <div class="screen" id="screen" data-view="radar">
    <div id="lmap"></div>

    <div id="satview">
      <img id="satimg" alt="GOES-East GeoColor satellite image">
      <div class="satmsg">GOES-EAST IMAGE UNAVAILABLE — CHECK CONNECTION</div>
    </div>

    <div id="boards">
      <div class="board" id="statsview" data-board="now"></div>
      <div class="board" id="board-cast" data-board="cast"></div>
      <div class="board" id="board-severe" data-board="severe"></div>
      <div class="board" id="board-air" data-board="air"></div>
      <div class="board" id="board-sky" data-board="sky"></div>
      <div class="boarddots" id="boardDots"></div>
    </div>

    <div id="predFrame"><span class="tab" id="predTab">PREDICTION</span></div>

    <div class="bar topbar chrome-all">
      <span class="brand">SKYWATCH</span>
      <span class="badge mrms" id="srcBadge">NEXRAD N0Q · IEM</span>
      <button class="badge alertchip" id="alertChip" hidden></button>
      <span class="spacer"></span>
      <span class="frametime" id="frameTime">--:--</span>
      <span class="spacer"></span>
      <div class="clockbox">
        <div class="clock" id="clock">--:--</div>
        <div>UPD <span id="updCount">-:--</span></div>
      </div>
    </div>

    <div class="status chrome-radar" id="status">loading…</div>

    <div class="zoomstack chrome-all">
      <button class="btn chrome-radar" id="zoomIn" aria-label="Zoom in">+</button>
      <button class="btn chrome-radar" id="zoomOut" aria-label="Zoom out">−</button>
      <button class="btn chrome-radar" id="layersBtn" aria-label="Map layers" style="font-size:15px">≡</button>
      <button class="btn small chrome-map" id="satBtn" aria-label="Switch between radar and satellite view">SAT</button>
      <button class="btn chrome-all" id="locsBtn" aria-label="Saved locations" style="font-size:15px">⌂</button>
    </div>

    <div id="layersdrawer">
      <div class="title">MAP LAYERS</div>
      <div class="layerrows" id="layerRows"></div>
    </div>

    <div id="alertsheet">
      <div class="title">
        <span>ALERT DETAILS</span>
        <button id="alertsheetClose" aria-label="Close alert details">✕</button>
      </div>
      <div id="alertsheetBody"></div>
    </div>

    <div class="legend chrome-radar">
      <div class="cap">REFLECTIVITY dBZ</div>
      <div class="swatches" id="legendSwatches"></div>
      <div class="marks"><span>10</span><span>25</span><span>40</span><span>55</span><span>70</span></div>
    </div>

    <div class="wx chrome-radar" id="wxPanel" title="Tap for detailed conditions">
      <div class="place" id="wxPlace">LOCAL CONDITIONS</div>
      <div class="hint" id="wxHint">TAP ⌂ TO SET A LOCATION</div>
      <div class="big" style="display:none" id="wxBig">
        <span class="temp" id="wxTemp">--°</span>
        <span class="cond" id="wxCond"></span>
      </div>
      <div class="rows" style="display:none" id="wxRows"></div>
    </div>

    <div class="bar botbar chrome-radar">
      <button class="btn" id="playBtn" aria-label="Play or pause">⏸</button>
      <div class="scrubwrap">
        <span class="spanlabel">-50 MIN</span>
        <div class="trackbox" id="trackbox" tabindex="0" role="slider"
             aria-label="Radar timeline" aria-valuemin="-50" aria-valuemax="165"
             aria-valuenow="0" aria-valuetext="now">
          <div class="track"></div>
          <div class="nowmark">NOW</div>
          <div class="thumb" id="thumb"></div>
        </div>
        <span class="spanlabel fcst">+2:45</span>
      </div>
    </div>

    </div>
  </div>
</div>

<script src="vendor/leaflet/leaflet.js"></script>
<script src="vendor/suncalc.js"></script>
<script type="module" src="js/main.js"></script>
</body>
</html>
