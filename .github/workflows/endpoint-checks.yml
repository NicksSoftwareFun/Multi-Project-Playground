name: Weekly endpoint health checks

on:
  schedule:
    - cron: '17 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  endpoints:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Run endpoint checks (advisory — always exits 0)
        run: node weather-radar-viewer/tests/integration/endpoint-checks.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: endpoint-results
          path: endpoint-results.json
