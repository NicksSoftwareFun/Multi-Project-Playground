name: Deploy PWA to GitHub Pages

on:
  push:
    branches: [claude/weather-radar-sources-l13g18]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          # the PWA folder becomes the site root
          path: weather-radar-viewer/pwa
      - id: deployment
        uses: actions/deploy-pages@v4
